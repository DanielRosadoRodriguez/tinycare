<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil • TinyCare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{ background:#f8fafc; color:#0f172a; }
    .profile-card{ max-width:720px; margin:3rem auto; }
  </style>
</head>
<body>
  <main class="container profile-card">
    <div class="card">
      <div class="card-body">
        <h1 class="h4 mb-2">Perfil de {{ user.get_full_name|default:user.username }}</h1>
        <p class="text-muted mb-3">Usuario: <strong>{{ user.username }}</strong></p>
        <p class="mb-0">Email: <strong>{{ user.email }}</strong></p>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
