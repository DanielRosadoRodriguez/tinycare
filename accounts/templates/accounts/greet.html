<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hola • TinyCare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --tc-bg: #f8fafc;
      --tc-text: #0f172a;
      --tc-muted:#64748b;
      --tc-surface:#ffffff;
      --tc-primary:#0d6efd;        /* Bootstrap primary */
      --tc-ring: rgba(13,110,253,.35);
      --tc-radius: 1.25rem;
      --tc-shadow: 0 10px 25px rgba(2,6,23,.08), 0 2px 6px rgba(2,6,23,.06);
    }

    /* Fondo estético y suave */
    body{
      color: var(--tc-text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #c7d2fe33 0%, #ffffff00 60%),
        radial-gradient(900px 500px at 110% 10%, #a7f3d033 0%, #ffffff00 60%),
        linear-gradient(180deg, #ffffff 0%, var(--tc-bg) 100%);
      min-height: 100vh;
    }

    /* Composición centrada y ancho de lectura óptimo */
    .hero-wrap{
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding-block: 3rem;
    }
    .hero-card{
      position: relative;
      width: min(92vw, 68ch); /* ~escala a 50–75 caracteres */
      background: color-mix(in srgb, var(--tc-surface) 88%, transparent);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.65);
      border-radius: var(--tc-radius);
      box-shadow: var(--tc-shadow);
    }
    .hero-card .card-body{
      padding: clamp(1.5rem, 2.5vw + 1rem, 2.25rem);
    }

    h1{
      letter-spacing: -0.02em;
    }
    .lead{
      color: var(--tc-muted);
    }

    /* Botones: microinteracciones sutiles y accesibles */
    .btn{
      border-radius: calc(var(--tc-radius) - .25rem);
      transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease, color .18s ease, border-color .18s ease;
    }
    .btn-primary{
      box-shadow: 0 6px 16px rgba(13,110,253,.20);
    }
    .btn-primary:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(13,110,253,.25);
      background-color: #0b5ed7; /* mantiene contraste */
      border-color: #0a58ca;
    }
    .btn-outline-primary:hover{
      background-color: #e7f1ff;
      border-color: #0d6efd;
      color: #0d6efd;
    }

    /* Enfoque accesible */
    .btn:focus-visible, a.btn:focus-visible{
      outline: 3px solid var(--tc-ring);
      outline-offset: 3px;
      box-shadow: 0 0 0 4px var(--tc-ring);
    }

    /* Decoración sutil */
    .halo{
      position: absolute; inset: -1px;
      pointer-events: none;
      border-radius: inherit;
      background:
        radial-gradient(600px 200px at 20% 0%, #60a5fa22, transparent 60%),
        radial-gradient(500px 240px at 80% 100%, #34d39922, transparent 60%);
      mask: linear-gradient(#000, transparent 65%);
    }

    /* Respeto a reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .btn{ transition: none; }
    }
  </style>
</head>
<body>
  <main class="hero-wrap container">
    <div class="hero-card card shadow-sm mx-auto text-center">
      <div class="halo"></div>
      <div class="card-body">
        <h1 class="display-6 mb-2">Hola, {{ display_name }} 👋</h1>
        <p class="lead mb-4">¡Bienvenido(a) a TinyCare!</p>

        <div class="d-flex justify-content-center gap-2 gap-md-3">
          <!-- Acción secundaria: ir al blog -->
          <a href="{% url 'blogs:blog-index' %}" class="btn btn-primary btn-lg px-4">
            Ir al blog
          </a>

          <!-- Logout: único lugar del sitio donde está el control de salida -->
          <a href="{% url 'accounts:logout' %}" class="btn btn-outline-danger btn-lg px-4">
            Cerrar sesión
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS (opcional para ciertos componentes) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
