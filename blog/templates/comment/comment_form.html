<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Formulario • Blog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --tc-bg:#f8fafc;
      --tc-text:#0f172a;
      --tc-muted:#64748b;
      --tc-card:#ffffff;
      --tc-ring:79,70,229; /* indigo focus ring */
    }
    body{ background:var(--tc-bg); color:var(--tc-text); }

    /* Encabezado visual */
    .page-hero{
      border-radius:1rem;
      padding:clamp(1rem,3vw,1.75rem);
      margin-bottom:1.25rem;
      background:
        linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)),
        linear-gradient(135deg,#0ea5e9 0%,#6366f1 60%,#7c3aed 100%);
      color:#fff;
    }
    .page-hero h1{ font-weight:800; letter-spacing:.2px; margin:0; }
    .page-hero p{ margin:0; opacity:.95; }

    /* Tarjeta contenedora */
    .card{
      border:0; border-radius:1rem;
      background:var(--tc-card);
      box-shadow:0 10px 26px rgba(2,6,23,.07);
    }

    /* Mejora de {{ form.as_p }} sin tocar el form en Python */
    .form-wrap p{ margin-bottom:1rem; }
    .form-wrap label{ display:block; font-weight:600; margin-bottom:.35rem; }
    .form-wrap input[type="text"],
    .form-wrap input[type="email"],
    .form-wrap input[type="password"],
    .form-wrap input[type="url"],
    .form-wrap input[type="number"],
    .form-wrap input[type="date"],
    .form-wrap input[type="time"],
    .form-wrap input[type="datetime-local"],
    .form-wrap textarea,
    .form-wrap select{
      display:block; width:100%;
      padding:.6rem .75rem;
      border:1px solid #e5e7eb; border-radius:.6rem;
      background:#fff; color:var(--tc-text);
      transition:border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
    }
    .form-wrap input:focus,
    .form-wrap textarea:focus,
    .form-wrap select:focus{
      border-color: rgba(var(--tc-ring), .6);
      box-shadow: 0 0 0 .25rem rgba(var(--tc-ring), .25);
      outline:0;
    }

    /* Errores Django (ul.errorlist) */
    .form-wrap ul.errorlist{
      list-style:none; padding:.75rem 1rem; margin:0 0 .75rem 0;
      background:#fef2f2; border:1px solid #fee2e2; color:#991b1b; border-radius:.5rem;
    }

    /* Botón submit (resaltado, hover visible, foco accesible) */
    .btn-primary{
      --bs-btn-bg:#4f46e5; --bs-btn-border-color:#4f46e5;
      --bs-btn-hover-bg:#4338ca; --bs-btn-hover-border-color:#4338ca;
      --bs-btn-active-bg:#3730a3; --bs-btn-active-border-color:#3730a3;
      font-weight:600;
    }
    .btn:focus-visible{
      box-shadow:0 0 0 .25rem rgba(var(--tc-ring), .35) !important;
    }

    /* Respeta preferencias de movimiento */
    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; }
    }
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="page-hero">
      <h1 class="h3">Formulario</h1>
      <p class="small">Completa los campos y envía.</p>
    </header>

    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card">
          <div class="card-body p-4 p-md-5">
            {% if form.non_field_errors %}
              <div class="alert alert-danger mb-4" role="alert">{{ form.non_field_errors }}</div>
            {% endif %}

            <form method="post" class="form-wrap">
              {% csrf_token %}
              {{ form.as_p }}

              <!-- mantengo el input submit original, solo lo estilizo -->
              <input type="submit" value="Submit" class="btn btn-primary btn-lg mt-2">
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
