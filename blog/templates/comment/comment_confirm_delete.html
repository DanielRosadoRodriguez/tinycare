<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Eliminar comentario • TinyCare</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --tc-bg:#f8fafc;
      --tc-text:#0f172a;
      --tc-muted:#64748b;
      --tc-ring:79,70,229; /* indigo */
      --tc-danger:#dc3545; /* danger */
    }
    body{ background:var(--tc-bg); color:var(--tc-text); }

    /* Hero con énfasis de acción destructiva */
    .page-hero{
      border-radius:1rem;
      padding:clamp(1rem,3vw,1.75rem);
      margin-bottom:1.25rem;
      background:
        linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)),
        linear-gradient(135deg,#ef4444 0%,#f59e0b 50%,#f97316 100%);
      color:#fff;
    }
    .page-hero h1{ font-weight:800; letter-spacing:.2px; margin:0; }

    /* Tarjeta de confirmación */
    .confirm-card{
      border:1px solid #fee2e2;
      border-radius:1rem;
      background:#ffffff;
      box-shadow:0 10px 26px rgba(2,6,23,.07);
    }
    .confirm-badge{
      width:52px; height:52px; border-radius:999px;
      background:#fee2e2; color:#b91c1c; font-weight:800;
      display:flex; align-items:center; justify-content:center;
      flex:0 0 52px;
    }
    .confirm-title{ font-weight:700; margin:0; }
    .confirm-hint{ color:var(--tc-muted); }

    /* Botones (estados visibles) */
    .btn-danger{
      --bs-btn-bg: var(--tc-danger);
      --bs-btn-border-color: var(--tc-danger);
      --bs-btn-hover-bg:#bb2d3b;
      --bs-btn-hover-border-color:#b02a37;
      --bs-btn-active-bg:#a52834;
      --bs-btn-active-border-color:#a52834;
      font-weight:600;
    }
    .btn-outline-secondary{ font-weight:600; }
    .btn:focus-visible{
      box-shadow:0 0 0 .25rem rgba(var(--tc-ring), .35) !important;
    }

    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; }
    }
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <!-- Encabezado -->
    <header class="page-hero">
      <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2">
        <h1 class="h3">Eliminar comentario</h1>
        <button type="button" class="btn btn-outline-light" onclick="history.back()">Volver</button>
      </div>
    </header>

    <!-- Contenido -->
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="confirm-card p-4 p-md-5">
          <div class="d-flex align-items-start gap-3">
            <div class="confirm-badge" aria-hidden="true">!</div>
            <div class="flex-grow-1">
              <h2 class="confirm-title h5 mb-2">¿Seguro que deseas eliminar este comentario?</h2>

              <!-- Muestra el contenido del comentario (en una “cita” para mayor claridad) -->
              <figure class="mb-4">
                <blockquote class="blockquote mb-1">“{{ object.content }}”</blockquote>
                <figcaption class="blockquote-footer m-0">Este cambio es <strong>irreversible</strong>.</figcaption>
              </figure>

              <!-- Formulario original: misma funcionalidad, mejor apariencia -->
              <form method="post" class="d-grid d-sm-flex gap-2">
                {% csrf_token %}
                <button type="button" class="btn btn-outline-secondary btn-lg" onclick="history.back()">Cancelar</button>
                <input type="submit" value="Eliminar definitivamente" class="btn btn-danger btn-lg">
              </form>
            </div>
          </div>
        </div>

        <div class="text-center mt-4">
          <button type="button" class="link-secondary text-decoration-none btn btn-link p-0" onclick="history.back()">Volver sin eliminar</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
