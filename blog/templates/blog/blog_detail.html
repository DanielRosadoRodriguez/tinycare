<h1>{{ blog.title }}</h1>
<div>{{ blog.content | safe}}</div>

<a href="{% url 'blogs:blog-update' blog.pk %}">Edit Blog</a>
<a href="{% url 'blogs:blog-delete' blog.pk %}">Delete Blog</a>
<h3>Comments</h3>
{% for comment in comments %}
    <div>
        <p>{{ comment.author }} :</p>
        <p>{{ comment.content }}</p>
        <p>At: {{ comment.created_at }}</p>
    </div>
{% empty %}
    <p>Aún no existen comentarios</p>
{% endfor %}

<h3>Add a Comment</h3>
<form method="post" action="{% url 'blogs:blog-detail' blog.pk %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Comentar</button>
</form>
