<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eliminar Bebé • TinyCare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8fafc; color:#0f172a; }
    .delete-container { max-width:580px; margin:3rem auto; }
  </style>
</head>
<body>
  <main class="container delete-container">
    <div class="card">
      <div class="card-body">
        <h1 class="h4 mb-3 text-danger">Confirmar eliminación</h1>
        
        <p>¿Estás seguro de que deseas eliminar el registro de <strong>{{ baby.nombre }}</strong>?</p>
        <p class="text-muted">Esta acción no se puede deshacer.</p>

        <form method="post" class="mt-4">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'babies:baby_detail' baby.pk %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
