{% load privacy_filters %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Aviso de Privacidad</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <h1 class="mb-4">Aviso de Privacidad</h1>
        
        {% if privacy_notice %}
          <div class="card">
            <div class="card-body">
              {{ privacy_notice.content|markdown }}
            </div>
            <div class="card-footer text-muted">
              <small>Última actualización: {{ privacy_notice.created_at|date:"d/m/Y H:i" }}</small>
            </div>
          </div>
        {% else %}
          <div class="alert alert-warning">
            No hay un aviso de privacidad activo en este momento.
          </div>
        {% endif %}
        
        <div class="mt-4">
          <a href="/" class="btn btn-outline-secondary">Volver al inicio</a>
        </div>
      </div>
    </div>
  </body>
</html>
