<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle de Notificación • TinyCare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8fafc; color:#0f172a; }
    .main-container { max-width:720px; margin:2rem auto; }
    .notification-content {
      font-size: 1.1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="container main-container">
    <div class="card shadow-sm">
      <div class="card-body p-4 p-md-5">
        
        <h1 class="h4">{{ notification.get_notification_type_display }}</h1>
        <small class="text-muted d-block mb-3">
          Fecha: {{ notification.created_at|date:"d M, Y \a \l\a\s h:i A" }}
        </small>
        
        <hr>

        <div class="notification-content mt-4">
          <p>{{ notification.message|safe|linebreaksbr }}</p>
        </div>

        <hr class="mt-4">
        
        <a href="{% url 'notifications:notification-list' %}" class="btn btn-primary">
          &larr; Volver a Notificaciones
        </a>

      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
